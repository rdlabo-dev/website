<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand">
      <p class="site-footer__title">{{ site.name }}</p>
      <p class="site-footer__description">{{ site.description }}</p>
    </div>

    <nav class="site-footer__nav" aria-label="Footer">
      <ul class="site-footer__list">
        @for (link of navLinks; track link.href) {
          <li>
            @if (link.sameSite) {
              <a class="site-footer__link" [href]="link.href">
                {{ link.label }}
              </a>
            } @else if (link.external) {
              <a
                class="site-footer__link external-link"
                [href]="link.href"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ link.label }}
              </a>
            } @else {
              <a class="site-footer__link" [routerLink]="link.href">{{ link.label }}</a>
            }
          </li>
        }
      </ul>
    </nav>

    <p class="site-footer__copyright">
      © {{ currentYear }} rdlabo. Released under the MIT License.
    </p>
  </div>
</footer>
