name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RDLABO_DOCS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      RDLABO_DOCS_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.html_url || 'https://github.com/rdlabo-dev/website' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
      - run: test -z "$(git status --porcelain --untracked-files=all -- projects/docs/src/app/generated projects/docs/public/sitemap.xml projects/web-site/src/app/generated projects/web-site/public/article-images projects/web-site/public/sitemap.xml)"
      - run: npm run build
      - run: npm run seo:audit
      - run: test -z "$(git status --porcelain --untracked-files=all -- projects/docs/src/app/generated projects/docs/public/sitemap.xml projects/web-site/src/app/generated projects/web-site/public/article-images projects/web-site/public/sitemap.xml)"
